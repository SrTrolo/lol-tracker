# ─────────────────────────────────────────────────────────────
#  LoL match tracker — configuration
#  Edit this file (the GitHub web editor works fine) and commit.
#  Changes apply on the next check.
# ─────────────────────────────────────────────────────────────

# Players to track. "name" and "tag" form the Riot ID (Name#TAG).
# "region" is optional; default_region is used when it's missing.
# Valid regions: euw, eune, tr, ru, me, na, br, lan, las, kr, jp, oce, sg, tw, vn, ph, th
players:
  - name: "Player1"
    tag: "EUW"
  - name: "Player2"
    tag: "EUW"
  - name: "Player3"
    tag: "EUW"
  # - name: "AnotherFriend"
  #   tag: "1234"
  #   region: euw

default_region: euw

# Queues to watch. For now: soloq, flex
# (also available: normal, quickplay, aram)
queues:
  - soloq
  - flex

# Which results get posted: wins | losses | both
show: both

# Remakes are never posted when this is true
skip_remakes: true

# Time zone used for the date on the card
timezone: Europe/Madrid

# Language of the card text: es | en
language: es

# How many recent matches per queue are checked on each run
matches_per_check: 5

# Memes: PNG / JPG / WEBP / GIF files in the win/ and loss/ folders of your
# private memes repo (see README → Memes).
# A random one is shown in a frame next to the title. Animated GIF / WEBP
# memes turn the whole card into an animated GIF.
# If the folder is empty, the card is sent without a meme.
memes:
  enabled: true

# Who gets a notification: these roles / people are @mentioned with every card.
# Nobody else is pinged (set the server's default notifications to "Only @mentions").
# To get an ID: Discord → User Settings → Advanced → Developer Mode, then
# right-click the role (or person) → Copy ID. Keep the quotes.
mentions:
  roles: []
  users: []

# Message text. One is picked at random.
# Variables: {player} {queue} {champion} {kda} {position} {duration}
messages:
  win:
    - "🏆 **{player}** ha ganado una {queue} con {champion} ({kda})"
    - "✅ Victoria de **{player}** con {champion} en {queue}. {kda}, nada mal."
  loss:
    - "💀 **{player}** ha perdido una {queue} con {champion} ({kda})"
    - "📉 Otra para la colección: **{player}** cae con {champion} en {queue} ({kda})"
    - "🪦 F en el chat por **{player}**. {champion}, {kda}, {duration} de sufrimiento."
